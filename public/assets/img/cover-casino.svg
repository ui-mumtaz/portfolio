<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 675"
  width="1200"
  height="675"
  role="img"
  aria-label="Casino jackpot fill and verification screen: a three-step fill to verify workflow above an infinite-scrolling verification table"
>
  <defs>
    <linearGradient id="c-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161616" />
      <stop offset="1" stop-color="#0b0b0b" />
    </linearGradient>
    <radialGradient id="c-glow" cx="0.5" cy="0.05" r="0.9">
      <stop offset="0" stop-color="#ed2024" stop-opacity="0.2" />
      <stop offset="1" stop-color="#ed2024" stop-opacity="0" />
    </radialGradient>
    <pattern id="c-dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.3" fill="#ffffff" fill-opacity="0.05" />
    </pattern>
    <linearGradient id="c-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e0e0e" stop-opacity="0" />
      <stop offset="1" stop-color="#0e0e0e" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#c-bg)" />
  <rect width="1200" height="675" fill="url(#c-dots)" />
  <rect width="1200" height="675" fill="url(#c-glow)" />

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#ffffff">
    <rect x="90" y="52" width="44" height="3" rx="1.5" fill="#ed2024" />
    <text x="90" y="84" font-size="13" font-weight="700" letter-spacing="3.2" fill="#ff6b6e">JACKPOT FILL &amp; VERIFICATION</text>
    <text x="1110" y="84" font-size="13" font-weight="600" letter-spacing="1.4" fill="#8a8a8a" text-anchor="end">shared design system</text>

    <!-- progress stepper: fill -> process -> verify -->
    <g>
      <path d="M188 132 H1012" stroke="#2a2a2a" stroke-width="2" />
      <path d="M188 132 H600" stroke="#ed2024" stroke-width="2.6" stroke-linecap="round" />

      <circle cx="188" cy="132" r="17" fill="#ed2024" />
      <path d="M181 132 l5 5 9 -10" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
      <text x="188" y="174" text-anchor="middle" font-size="12.5" font-weight="600">Fill</text>

      <circle cx="600" cy="132" r="17" fill="#ed2024" />
      <path d="M593 132 l5 5 9 -10" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
      <text x="600" y="174" text-anchor="middle" font-size="12.5" font-weight="600">Process</text>

      <circle cx="1012" cy="132" r="17" fill="#1f1f1f" stroke="#ed2024" stroke-width="2.4" />
      <text x="1012" y="137" text-anchor="middle" font-size="13" font-weight="700" fill="#ff6b6e">3</text>
      <text x="1012" y="174" text-anchor="middle" font-size="12.5" font-weight="600" fill="#c8c8c8">Verify</text>
    </g>

    <!-- table -->
    <rect x="90" y="212" width="1020" height="330" rx="12" fill="#121212" stroke="#262626" />

    <!-- toolbar -->
    <g>
      <rect x="118" y="238" width="230" height="30" rx="15" fill="#1a1a1a" stroke="#333333" />
      <circle cx="137" cy="253" r="5.5" fill="none" stroke="#7a7a7a" stroke-width="1.8" />
      <path d="M141 257 l6 6" stroke="#7a7a7a" stroke-width="1.8" stroke-linecap="round" />
      <text x="156" y="258" font-size="12" fill="#7a7a7a">Search jackpots</text>

      <rect x="362" y="238" width="96" height="30" rx="15" fill="#1a1a1a" stroke="#333333" />
      <text x="410" y="258" text-anchor="middle" font-size="12" font-weight="600" fill="#c8c8c8">Filter</text>

      <rect x="962" y="238" width="120" height="30" rx="15" fill="#c4141b" />
      <text x="1022" y="258" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="0.6">VERIFY</text>
    </g>

    <!-- header row -->
    <g font-size="11" font-weight="700" letter-spacing="1.6" fill="#7a7a7a">
      <path d="M118 290 H1082" stroke="#242424" stroke-width="1" />
      <text x="118" y="310">MACHINE</text>
      <text x="330" y="310">AMOUNT</text>
      <text x="520" y="310">ATTENDANT</text>
      <text x="760" y="310">STATUS</text>
      <text x="1082" y="310" text-anchor="end">SIGN-OFF</text>
    </g>

    <!-- rows -->
    <g font-size="13.5">
      <!-- selected row -->
      <rect x="112" y="322" width="976" height="46" rx="8" fill="#1c1414" stroke="#ed2024" stroke-opacity="0.5" />
      <text x="124" y="350" font-weight="600">SLOT-2841</text>
      <text x="336" y="350" font-weight="700" fill="#ff9a9c">$12,500.00</text>
      <text x="526" y="350" fill="#c8c8c8">A. Rivera</text>
      <rect x="760" y="335" width="104" height="22" rx="11" fill="#ed2024" />
      <text x="812" y="350" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="0.8">PENDING</text>
      <circle cx="1070" cy="345" r="9" fill="none" stroke="#ed2024" stroke-width="2" />

      <rect x="112" y="374" width="976" height="44" rx="8" fill="#161616" />
      <text x="124" y="401" font-weight="600" fill="#d8d8d8">SLOT-1907</text>
      <text x="336" y="401" font-weight="600" fill="#c8c8c8">$8,240.00</text>
      <text x="526" y="401" fill="#9a9a9a">M. Chen</text>
      <rect x="760" y="387" width="104" height="22" rx="11" fill="#242424" stroke="#3a3a3a" />
      <text x="812" y="402" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="0.8" fill="#9a9a9a">FILLED</text>
      <g stroke="#5a8f5a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1063 395 l5 5 9 -10" />
      </g>

      <rect x="112" y="424" width="976" height="44" rx="8" fill="#141414" />
      <text x="124" y="451" font-weight="600" fill="#c4c4c4">SLOT-3355</text>
      <text x="336" y="451" font-weight="600" fill="#b4b4b4">$3,975.00</text>
      <text x="526" y="451" fill="#8a8a8a">J. Okafor</text>
      <rect x="760" y="437" width="104" height="22" rx="11" fill="#242424" stroke="#3a3a3a" />
      <text x="812" y="452" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="0.8" fill="#8a8a8a">VERIFIED</text>
      <g stroke="#5a8f5a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1063 445 l5 5 9 -10" />
      </g>

      <rect x="112" y="474" width="976" height="44" rx="8" fill="#131313" />
      <text x="124" y="501" font-weight="600" fill="#9a9a9a">SLOT-0682</text>
      <text x="336" y="501" font-weight="600" fill="#8a8a8a">$1,120.00</text>
      <text x="526" y="501" fill="#6e6e6e">R. Silva</text>
    </g>

    <!-- infinite scroll: the last row fades out under a loading spinner -->
    <rect x="112" y="466" width="976" height="70" fill="url(#c-fade)" />
    <g>
      <path
        d="M528 516 a11 11 0 1 1 -7.8 3.2"
        fill="none"
        stroke="#ed2024"
        stroke-width="2.4"
        stroke-linecap="round"
      />
      <text x="556" y="524" font-size="11.5" font-weight="600" letter-spacing="1.4" fill="#8a8a8a">LOADING MORE · INFINITE SCROLL</text>
    </g>

    <!-- stack strip -->
    <g font-size="12.5" font-weight="600" fill="#c8c8c8">
      <rect x="90" y="568" width="130" height="34" rx="17" fill="#1a1a1a" stroke="#333333" />
      <text x="155" y="590" text-anchor="middle">Angular 18</text>
      <rect x="232" y="568" width="112" height="34" rx="17" fill="#1a1a1a" stroke="#333333" />
      <text x="288" y="590" text-anchor="middle">PrimeNG</text>
      <rect x="356" y="568" width="152" height="34" rx="17" fill="#1a1a1a" stroke="#333333" />
      <text x="432" y="590" text-anchor="middle">Bootstrap 5</text>
      <rect x="520" y="568" width="112" height="34" rx="17" fill="#1a1a1a" stroke="#333333" />
      <text x="576" y="590" text-anchor="middle">OIDC</text>
      <rect x="644" y="568" width="130" height="34" rx="17" fill="#1a1a1a" stroke="#333333" />
      <text x="709" y="590" text-anchor="middle">pa11y-ci</text>
      <rect x="786" y="568" width="122" height="34" rx="17" fill="#1a1a1a" stroke="#333333" />
      <text x="847" y="590" text-anchor="middle">ng-mocks</text>
      <rect x="920" y="568" width="112" height="34" rx="17" fill="#1a1a1a" stroke="#333333" />
      <text x="976" y="590" text-anchor="middle">Helm</text>
    </g>

    <text x="90" y="638" font-size="12" font-weight="600" letter-spacing="1.6" fill="#6e6e6e">JackpotFill.UI + JackpotFill.BFF</text>
  </g>
</svg>
