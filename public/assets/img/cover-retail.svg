<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 675"
  width="1200"
  height="675"
  role="img"
  aria-label="Click and collect order management: kiosk and hostess modes, order staging lanes, QR scanning and signature capture"
>
  <defs>
    <linearGradient id="r-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161616" />
      <stop offset="1" stop-color="#0b0b0b" />
    </linearGradient>
    <radialGradient id="r-glow" cx="0.85" cy="0.9" r="0.85">
      <stop offset="0" stop-color="#ed2024" stop-opacity="0.18" />
      <stop offset="1" stop-color="#ed2024" stop-opacity="0" />
    </radialGradient>
    <pattern id="r-dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.3" fill="#ffffff" fill-opacity="0.05" />
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#r-bg)" />
  <rect width="1200" height="675" fill="url(#r-dots)" />
  <rect width="1200" height="675" fill="url(#r-glow)" />

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#ffffff">
    <rect x="90" y="52" width="44" height="3" rx="1.5" fill="#ed2024" />
    <text x="90" y="84" font-size="13" font-weight="700" letter-spacing="3.2" fill="#ff6b6e">CLICK &amp; COLLECT · ORDER MANAGEMENT</text>

    <!-- mode toggle: kiosk / hostess -->
    <g font-size="12" font-weight="700" letter-spacing="1.2">
      <rect x="924" y="62" width="186" height="30" rx="15" fill="#1a1a1a" stroke="#333333" />
      <rect x="926" y="64" width="90" height="26" rx="13" fill="#ed2024" />
      <text x="971" y="81" text-anchor="middle" font-size="11">KIOSK</text>
      <text x="1064" y="81" text-anchor="middle" font-size="11" fill="#8a8a8a">HOSTESS</text>
    </g>

    <!-- three staging lanes -->
    <g>
      <!-- lane 1 -->
      <rect x="90" y="122" width="316" height="330" rx="12" fill="#121212" stroke="#262626" />
      <text x="112" y="152" font-size="11.5" font-weight="700" letter-spacing="2" fill="#8a8a8a">RECEIVED</text>
      <rect x="352" y="138" width="34" height="20" rx="10" fill="#242424" stroke="#3a3a3a" />
      <text x="369" y="152" text-anchor="middle" font-size="11" font-weight="700" fill="#9a9a9a">7</text>

      <g font-size="13">
        <rect x="110" y="170" width="276" height="64" rx="8" fill="#191919" stroke="#2c2c2c" />
        <text x="126" y="196" font-weight="600">#84021</text>
        <text x="126" y="216" font-size="11" fill="#8a8a8a">3 items · Aisle B4</text>
        <rect x="330" y="182" width="40" height="40" rx="6" fill="#0f0f0f" stroke="#3a3a3a" />
        <g fill="#8a8a8a">
          <rect x="337" y="189" width="9" height="9" /><rect x="354" y="189" width="9" height="9" />
          <rect x="337" y="206" width="9" height="9" /><rect x="352" y="204" width="4" height="4" />
          <rect x="359" y="209" width="4" height="4" />
        </g>

        <rect x="110" y="246" width="276" height="64" rx="8" fill="#171717" stroke="#262626" />
        <text x="126" y="272" font-weight="600" fill="#d8d8d8">#84019</text>
        <text x="126" y="292" font-size="11" fill="#7a7a7a">1 item · Aisle A1</text>

        <rect x="110" y="322" width="276" height="64" rx="8" fill="#151515" stroke="#242424" />
        <text x="126" y="348" font-weight="600" fill="#c4c4c4">#84016</text>
        <text x="126" y="368" font-size="11" fill="#6e6e6e">5 items · Aisle C2</text>
      </g>

      <!-- lane 2 (active) -->
      <rect x="442" y="122" width="316" height="330" rx="12" fill="#141212" stroke="#ed2024" stroke-opacity="0.5" />
      <text x="464" y="152" font-size="11.5" font-weight="700" letter-spacing="2" fill="#ff6b6e">STAGED</text>
      <rect x="704" y="138" width="34" height="20" rx="10" fill="#ed2024" />
      <text x="721" y="152" text-anchor="middle" font-size="11" font-weight="700">4</text>

      <g font-size="13">
        <rect x="462" y="170" width="276" height="88" rx="8" fill="#1c1414" stroke="#ed2024" stroke-opacity="0.6" />
        <text x="478" y="196" font-weight="600">#84008</text>
        <text x="478" y="216" font-size="11" fill="#a8a8a8">Scan to hand over</text>
        <!-- QR glyph -->
        <rect x="666" y="182" width="56" height="56" rx="6" fill="#0f0f0f" stroke="#ed2024" stroke-width="1.4" />
        <g fill="#ed2024">
          <rect x="674" y="190" width="14" height="14" /><rect x="700" y="190" width="14" height="14" />
          <rect x="674" y="216" width="14" height="14" />
          <rect x="700" y="216" width="6" height="6" /><rect x="710" y="224" width="6" height="6" />
        </g>
        <!-- scan beam -->
        <path d="M478 236 H648" stroke="#ed2024" stroke-width="2.2" stroke-linecap="round" opacity="0.75" />

        <rect x="462" y="270" width="276" height="64" rx="8" fill="#171717" stroke="#262626" />
        <text x="478" y="296" font-weight="600" fill="#d8d8d8">#83994</text>
        <text x="478" y="316" font-size="11" fill="#7a7a7a">Bay 12 · chilled</text>

        <rect x="462" y="346" width="276" height="64" rx="8" fill="#151515" stroke="#242424" />
        <text x="478" y="372" font-weight="600" fill="#c4c4c4">#83981</text>
        <text x="478" y="392" font-size="11" fill="#6e6e6e">Bay 03</text>
      </g>

      <!-- lane 3 -->
      <rect x="794" y="122" width="316" height="330" rx="12" fill="#121212" stroke="#262626" />
      <text x="816" y="152" font-size="11.5" font-weight="700" letter-spacing="2" fill="#8a8a8a">HANDED OVER</text>
      <rect x="1056" y="138" width="34" height="20" rx="10" fill="#242424" stroke="#3a3a3a" />
      <text x="1073" y="152" text-anchor="middle" font-size="11" font-weight="700" fill="#9a9a9a">21</text>

      <!-- signature capture card -->
      <rect x="814" y="170" width="276" height="120" rx="8" fill="#191919" stroke="#2c2c2c" />
      <text x="830" y="196" font-size="11" font-weight="700" letter-spacing="1.6" fill="#7a7a7a">SIGNATURE</text>
      <path
        d="M834 258 c14 -22 22 6 34 -10 c11 -15 18 18 30 2 c10 -13 16 12 27 -2 c9 -11 15 8 24 -4 c8 -10 14 6 22 -2"
        fill="none"
        stroke="#ffffff"
        stroke-width="2.4"
        stroke-linecap="round"
      />
      <path d="M830 272 H1074" stroke="#333333" stroke-width="1.4" />

      <g font-size="13">
        <rect x="814" y="302" width="276" height="60" rx="8" fill="#161616" stroke="#242424" />
        <text x="830" y="328" font-weight="600" fill="#d8d8d8">#83902</text>
        <text x="830" y="348" font-size="11" fill="#7a7a7a">Signed · 14:22</text>
        <g stroke="#5a8f5a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1052 328 l6 6 11 -12" />
        </g>

        <rect x="814" y="374" width="276" height="60" rx="8" fill="#151515" stroke="#222222" />
        <text x="830" y="400" font-weight="600" fill="#c4c4c4">#83880</text>
        <text x="830" y="420" font-size="11" fill="#6e6e6e">Signed · 13:58</text>
      </g>
    </g>

    <!-- encrypted realtime strip -->
    <g>
      <path d="M90 484 H1110" stroke="#242424" stroke-width="1.5" />
      <g font-size="11.5" font-weight="600" letter-spacing="1.4" fill="#7a7a7a">
        <circle cx="98" cy="508" r="4.5" fill="#ed2024" />
        <text x="114" y="512">SockJS live updates</text>
        <text x="290" y="512">TweetNaCl encrypted payloads</text>
        <text x="560" y="512">jsPDF · ExcelJS export</text>
        <text x="790" y="512">ZXing barcode / QR</text>
      </g>
    </g>

    <!-- stack strip -->
    <g font-size="12.5" font-weight="600" fill="#c8c8c8">
      <rect x="90" y="546" width="228" height="34" rx="17" fill="#1a1a1a" stroke="#333333" />
      <text x="204" y="568" text-anchor="middle">Angular 21 · Signals</text>
      <rect x="330" y="546" width="196" height="34" rx="17" fill="#1a1a1a" stroke="#333333" />
      <text x="428" y="568" text-anchor="middle">Angular Material</text>
      <rect x="538" y="546" width="122" height="34" rx="17" fill="#1a1a1a" stroke="#333333" />
      <text x="599" y="568" text-anchor="middle">Firebase</text>
      <rect x="672" y="546" width="150" height="34" rx="17" fill="#1a1a1a" stroke="#333333" />
      <text x="747" y="568" text-anchor="middle">ngx-translate</text>
      <rect x="834" y="546" width="140" height="34" rx="17" fill="#1a1a1a" stroke="#333333" />
      <text x="904" y="568" text-anchor="middle">SonarQube</text>
    </g>

    <text x="90" y="622" font-size="12" font-weight="600" letter-spacing="1.6" fill="#6e6e6e">Control XEC (CXEC)</text>
  </g>
</svg>
