<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 675"
  width="1200"
  height="675"
  role="img"
  aria-label="Storybook component library: a category sidebar beside a canvas of design-system components"
>
  <defs>
    <linearGradient id="d-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161616" />
      <stop offset="1" stop-color="#0b0b0b" />
    </linearGradient>
    <radialGradient id="d-glow" cx="0.12" cy="0.08" r="0.85">
      <stop offset="0" stop-color="#ed2024" stop-opacity="0.2" />
      <stop offset="1" stop-color="#ed2024" stop-opacity="0" />
    </radialGradient>
    <pattern id="d-dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.3" fill="#ffffff" fill-opacity="0.05" />
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#d-bg)" />
  <rect width="1200" height="675" fill="url(#d-dots)" />
  <rect width="1200" height="675" fill="url(#d-glow)" />

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#ffffff">
    <rect x="90" y="52" width="44" height="3" rx="1.5" fill="#ed2024" />
    <text x="90" y="84" font-size="13" font-weight="700" letter-spacing="3.2" fill="#ff6b6e">SHARED DESIGN SYSTEM</text>
    <text x="1110" y="84" font-size="13" font-weight="600" letter-spacing="1.4" fill="#8a8a8a" text-anchor="end">38 components · 11 categories</text>

    <!-- storybook shell -->
    <rect x="90" y="112" width="1020" height="452" rx="12" fill="#101010" stroke="#262626" />

    <!-- sidebar -->
    <rect x="90" y="112" width="268" height="452" rx="12" fill="#151515" />
    <path d="M358 112 V564" stroke="#262626" stroke-width="1.5" />

    <rect x="112" y="136" width="224" height="28" rx="14" fill="#1c1c1c" stroke="#333333" />
    <circle cx="130" cy="150" r="5" fill="none" stroke="#7a7a7a" stroke-width="1.7" />
    <path d="M134 154 l5 5" stroke="#7a7a7a" stroke-width="1.7" stroke-linecap="round" />
    <text x="146" y="155" font-size="11.5" fill="#6e6e6e">Find components</text>

    <g font-size="12.5" font-weight="600">
      <!-- Action (expanded) -->
      <path d="M116 186 l6 5 -6 5" stroke="#ed2024" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <text x="132" y="196" fill="#ffffff">Action</text>
      <text x="336" y="196" text-anchor="end" font-size="11" fill="#6e6e6e">4</text>
      <g font-size="11.5" font-weight="500" fill="#8a8a8a">
        <rect x="140" y="206" width="196" height="20" rx="5" fill="#231818" />
        <text x="150" y="220" fill="#ff9a9c">Button</text>
        <text x="150" y="242">ButtonToggleGroup</text>
        <text x="150" y="264">Checkbox</text>
        <text x="150" y="286">RadioButton</text>
      </g>

      <g fill="#c8c8c8">
        <path d="M118 302 l5 6 5 -6" stroke="#5a5a5a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <text x="138" y="310">Information</text>
        <text x="336" y="310" text-anchor="end" font-size="11" fill="#6e6e6e">5</text>

        <path d="M118 336 l5 6 5 -6" stroke="#5a5a5a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <text x="138" y="344">Input</text>
        <text x="336" y="344" text-anchor="end" font-size="11" fill="#6e6e6e">9</text>

        <path d="M118 370 l5 6 5 -6" stroke="#5a5a5a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <text x="138" y="378">Layout</text>
        <text x="336" y="378" text-anchor="end" font-size="11" fill="#6e6e6e">3</text>

        <path d="M118 404 l5 6 5 -6" stroke="#5a5a5a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <text x="138" y="412">Navigation</text>
        <text x="336" y="412" text-anchor="end" font-size="11" fill="#6e6e6e">3</text>

        <path d="M118 438 l5 6 5 -6" stroke="#5a5a5a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <text x="138" y="446">Overlay</text>
        <text x="336" y="446" text-anchor="end" font-size="11" fill="#6e6e6e">3</text>

        <path d="M118 472 l5 6 5 -6" stroke="#5a5a5a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <text x="138" y="480">Structure</text>
        <text x="336" y="480" text-anchor="end" font-size="11" fill="#6e6e6e">5</text>

        <path d="M118 506 l5 6 5 -6" stroke="#5a5a5a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <text x="138" y="514">Utility components</text>
        <text x="336" y="514" text-anchor="end" font-size="11" fill="#6e6e6e">3</text>
      </g>
      <text x="138" y="546" font-size="11" font-weight="600" letter-spacing="1.2" fill="#5e5e5e">+ Text · Progress · svg/icons</text>
    </g>

    <!-- canvas: component specimens -->
    <text x="392" y="150" font-size="11.5" font-weight="700" letter-spacing="2" fill="#7a7a7a">CANVAS</text>

    <!-- buttons -->
    <g font-size="12" font-weight="600">
      <rect x="392" y="170" width="112" height="34" rx="6" fill="#c4141b" />
      <text x="448" y="192" text-anchor="middle">Primary</text>
      <rect x="516" y="170" width="112" height="34" rx="6" fill="transparent" stroke="#4a4a4a" stroke-width="1.5" />
      <text x="572" y="192" text-anchor="middle" fill="#d8d8d8">Secondary</text>
      <rect x="640" y="170" width="96" height="34" rx="6" fill="#1f1f1f" />
      <text x="688" y="192" text-anchor="middle" fill="#7a7a7a">Disabled</text>
    </g>

    <!-- chips -->
    <g font-size="11" font-weight="600">
      <rect x="760" y="176" width="74" height="22" rx="11" fill="#231818" stroke="#ed2024" stroke-opacity="0.5" />
      <text x="797" y="191" text-anchor="middle" fill="#ff9a9c">Active</text>
      <rect x="844" y="176" width="74" height="22" rx="11" fill="#1f1f1f" stroke="#3a3a3a" />
      <text x="881" y="191" text-anchor="middle" fill="#a8a8a8">Draft</text>
      <rect x="928" y="176" width="74" height="22" rx="11" fill="#1f1f1f" stroke="#3a3a3a" />
      <text x="965" y="191" text-anchor="middle" fill="#a8a8a8">Closed</text>
    </g>

    <!-- inputs -->
    <g font-size="12">
      <rect x="392" y="226" width="244" height="36" rx="6" fill="#161616" stroke="#3a3a3a" />
      <text x="406" y="249" fill="#8a8a8a">Autocomplete</text>
      <path d="M614 241 l6 7 6 -7" stroke="#7a7a7a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" />

      <rect x="652" y="226" width="180" height="36" rx="6" fill="#161616" stroke="#ed2024" stroke-opacity="0.6" />
      <text x="666" y="249" fill="#d8d8d8">2026-08-08</text>
      <rect x="800" y="235" width="18" height="18" rx="3" fill="none" stroke="#ed2024" stroke-width="1.6" />
      <path d="M800 241 H818" stroke="#ed2024" stroke-width="1.6" />

      <!-- checkbox + radio + toggle -->
      <rect x="852" y="234" width="20" height="20" rx="4" fill="#c4141b" />
      <path d="M857 244 l4 4 7 -8" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="896" cy="244" r="10" fill="none" stroke="#ed2024" stroke-width="2" />
      <circle cx="896" cy="244" r="4.5" fill="#ed2024" />
      <rect x="924" y="235" width="40" height="20" rx="10" fill="#c4141b" />
      <circle cx="954" cy="245" r="7" fill="#ffffff" />
      <rect x="978" y="235" width="40" height="20" rx="10" fill="#2a2a2a" />
      <circle cx="988" cy="245" r="7" fill="#8a8a8a" />
    </g>

    <!-- progress stepper -->
    <g>
      <circle cx="404" cy="298" r="10" fill="#ed2024" />
      <path d="M399 298 l4 4 6 -7" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M414 298 H470" stroke="#ed2024" stroke-width="2.2" />
      <circle cx="480" cy="298" r="10" fill="#ed2024" />
      <path d="M490 298 H546" stroke="#2a2a2a" stroke-width="2.2" />
      <circle cx="556" cy="298" r="10" fill="#1f1f1f" stroke="#4a4a4a" stroke-width="1.8" />
      <path d="M566 298 H622" stroke="#2a2a2a" stroke-width="2.2" />
      <circle cx="632" cy="298" r="10" fill="#1f1f1f" stroke="#4a4a4a" stroke-width="1.8" />
    </g>

    <!-- tabs -->
    <g font-size="12" font-weight="600">
      <text x="700" y="302" fill="#ffffff">Overview</text>
      <path d="M700 310 H762" stroke="#ed2024" stroke-width="2.4" />
      <text x="786" y="302" fill="#8a8a8a">Details</text>
      <text x="856" y="302" fill="#8a8a8a">History</text>
    </g>

    <!-- virtual-scroll table specimen -->
    <rect x="392" y="332" width="694" height="212" rx="8" fill="#141414" stroke="#282828" />
    <g font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#6e6e6e">
      <path d="M392 362 H1086" stroke="#242424" />
      <text x="410" y="354">ID</text>
      <text x="500" y="354">NAME</text>
      <text x="760" y="354">OWNER</text>
      <text x="960" y="354">STATE</text>
    </g>
    <g font-size="12">
      <rect x="392" y="362" width="694" height="34" fill="#191919" />
      <text x="410" y="384" fill="#e4e4e4">0041</text>
      <text x="500" y="384" fill="#c8c8c8">Table (virtual scroll)</text>
      <text x="760" y="384" fill="#8a8a8a">core</text>
      <rect x="960" y="370" width="60" height="18" rx="9" fill="#231818" />
      <text x="990" y="383" text-anchor="middle" font-size="10" font-weight="700" fill="#ff9a9c">LIVE</text>

      <rect x="392" y="398" width="694" height="34" fill="#151515" />
      <text x="410" y="420" fill="#c8c8c8">0042</text>
      <text x="500" y="420" fill="#b4b4b4">TreeWithCheckboxes</text>
      <text x="760" y="420" fill="#7a7a7a">utility</text>

      <rect x="392" y="434" width="694" height="34" fill="#141414" />
      <text x="410" y="456" fill="#b4b4b4">0043</text>
      <text x="500" y="456" fill="#a8a8a8">FileUploader</text>
      <text x="760" y="456" fill="#6e6e6e">utility</text>

      <rect x="392" y="470" width="694" height="34" fill="#131313" />
      <text x="410" y="492" fill="#9a9a9a">0044</text>
      <text x="500" y="492" fill="#8a8a8a">ConfirmationDialog</text>
      <text x="760" y="492" fill="#6e6e6e">overlay</text>
    </g>
    <!-- virtual scrollbar -->
    <rect x="1074" y="368" width="5" height="70" rx="2.5" fill="#ed2024" fill-opacity="0.75" />
    <rect x="1074" y="368" width="5" height="168" rx="2.5" fill="#ffffff" fill-opacity="0.06" />

    <g font-size="11" font-weight="600" letter-spacing="1.4" fill="#6e6e6e">
      <text x="392" y="530">Storybook · PrimeNG themes · custom schematics · ng-mocks</text>
    </g>

    <!-- stack strip -->
    <g font-size="12.5" font-weight="600" fill="#c8c8c8">
      <rect x="90" y="590" width="130" height="34" rx="17" fill="#1a1a1a" stroke="#333333" />
      <text x="155" y="612" text-anchor="middle">Angular 18</text>
      <rect x="232" y="590" width="122" height="34" rx="17" fill="#1a1a1a" stroke="#333333" />
      <text x="293" y="612" text-anchor="middle">Storybook</text>
      <rect x="366" y="590" width="112" height="34" rx="17" fill="#1a1a1a" stroke="#333333" />
      <text x="422" y="612" text-anchor="middle">PrimeNG</text>
      <rect x="490" y="590" width="146" height="34" rx="17" fill="#1a1a1a" stroke="#333333" />
      <text x="563" y="612" text-anchor="middle">SCSS tokens</text>
      <rect x="648" y="590" width="140" height="34" rx="17" fill="#1a1a1a" stroke="#333333" />
      <text x="718" y="612" text-anchor="middle">Schematics</text>
      <rect x="800" y="590" width="112" height="34" rx="17" fill="#1a1a1a" stroke="#333333" />
      <text x="856" y="612" text-anchor="middle">OIDC</text>
    </g>

    <text x="1110" y="612" font-size="12" font-weight="600" letter-spacing="1.6" fill="#6e6e6e" text-anchor="end">oasis-utility-shared-ui</text>
  </g>
</svg>
