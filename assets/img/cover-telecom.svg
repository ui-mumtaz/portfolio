<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 675"
  width="1200"
  height="675"
  role="img"
  aria-label="Telecom provisioning portal: network site topology with live STOMP order tracking and a ports order table"
>
  <defs>
    <linearGradient id="n-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161616" />
      <stop offset="1" stop-color="#0b0b0b" />
    </linearGradient>
    <radialGradient id="n-glow" cx="0.2" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#ed2024" stop-opacity="0.2" />
      <stop offset="1" stop-color="#ed2024" stop-opacity="0" />
    </radialGradient>
    <pattern id="n-dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.3" fill="#ffffff" fill-opacity="0.05" />
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#n-bg)" />
  <rect width="1200" height="675" fill="url(#n-dots)" />
  <rect width="1200" height="675" fill="url(#n-glow)" />

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#ffffff">
    <rect x="90" y="52" width="44" height="3" rx="1.5" fill="#ed2024" />
    <text x="90" y="84" font-size="13" font-weight="700" letter-spacing="3.2" fill="#ff6b6e">ON-DEMAND PROVISIONING</text>
    <text x="1110" y="84" font-size="13" font-weight="600" letter-spacing="1.4" fill="#8a8a8a" text-anchor="end">STOMP / WebSockets · live</text>

    <!-- app chrome: route tabs taken from the real portal -->
    <g font-size="12.5" font-weight="600">
      <rect x="90" y="110" width="1020" height="42" rx="8" fill="#151515" stroke="#262626" />
      <rect x="104" y="120" width="96" height="22" rx="11" fill="#ed2024" />
      <text x="152" y="135" text-anchor="middle" font-size="11.5" letter-spacing="1">dashboard</text>
      <g fill="#8a8a8a">
        <text x="228" y="136">connections</text>
        <text x="336" y="136">cross-connect</text>
        <text x="456" y="136">ip-access</text>
        <text x="548" y="136">ports</text>
        <text x="606" y="136">order</text>
        <text x="666" y="136">billing</text>
        <text x="734" y="136">activity</text>
      </g>
      <text x="1096" y="136" text-anchor="end" font-size="11.5" letter-spacing="1.2" fill="#8a8a8a">SSO</text>
    </g>

    <!-- ══════════ network topology ══════════ -->
    <rect x="90" y="172" width="608" height="348" rx="12" fill="#121212" stroke="#262626" />
    <text x="118" y="202" font-size="12" font-weight="700" letter-spacing="2.4" fill="#8a8a8a">NETWORK SITES</text>

    <!-- links -->
    <g stroke="#3a3a3a" stroke-width="1.6" fill="none">
      <path d="M196 322 L332 258" />
      <path d="M196 322 L318 400" />
      <path d="M332 258 L488 308" />
      <path d="M318 400 L488 308" />
      <path d="M488 308 L604 244" />
      <path d="M488 308 L600 414" />
      <path d="M318 400 L600 414" />
    </g>
    <!-- provisioned route highlighted -->
    <g stroke="#ed2024" stroke-width="2.6" fill="none" stroke-linecap="round">
      <path d="M196 322 L332 258 L488 308 L604 244" />
    </g>

    <!-- site nodes -->
    <g>
      <circle cx="196" cy="322" r="13" fill="#ed2024" />
      <circle cx="196" cy="322" r="23" fill="none" stroke="#ed2024" stroke-opacity="0.35" stroke-width="1.5" />
      <circle cx="332" cy="258" r="9" fill="#ed2024" />
      <circle cx="488" cy="308" r="9" fill="#ed2024" />
      <circle cx="604" cy="244" r="11" fill="#1f1f1f" stroke="#ed2024" stroke-width="2.4" />
      <circle cx="318" cy="400" r="8" fill="#2f2f2f" stroke="#4a4a4a" stroke-width="1.5" />
      <circle cx="600" cy="414" r="8" fill="#2f2f2f" stroke="#4a4a4a" stroke-width="1.5" />
    </g>
    <g font-size="11.5" font-weight="600" fill="#b4b4b4">
      <text x="196" y="362" text-anchor="middle">LON-A</text>
      <text x="332" y="238" text-anchor="middle">FRA-2</text>
      <text x="488" y="342" text-anchor="middle">AMS-1</text>
      <text x="604" y="222" text-anchor="middle">NYC-7</text>
      <text x="318" y="428" text-anchor="middle" fill="#6e6e6e">AMS-3</text>
      <text x="600" y="442" text-anchor="middle" fill="#6e6e6e">MAD-1</text>
    </g>

    <!-- multi-currency pricing -->
    <path d="M118 462 H670" stroke="#242424" stroke-width="1.4" />
    <g font-size="11.5" font-weight="700" letter-spacing="1">
      <rect x="118" y="478" width="62" height="26" rx="13" fill="#1f1f1f" stroke="#3a3a3a" />
      <text x="149" y="495" text-anchor="middle" fill="#c8c8c8">EUR</text>
      <rect x="188" y="478" width="62" height="26" rx="13" fill="#1f1f1f" stroke="#3a3a3a" />
      <text x="219" y="495" text-anchor="middle" fill="#c8c8c8">GBP</text>
      <rect x="258" y="478" width="62" height="26" rx="13" fill="#1f1f1f" stroke="#3a3a3a" />
      <text x="289" y="495" text-anchor="middle" fill="#c8c8c8">USD</text>
      <text x="336" y="495" font-size="11" font-weight="600" letter-spacing="1.4" fill="#7a7a7a">MULTI-CURRENCY PRICING</text>
    </g>

    <!-- ══════════ order tracking ══════════ -->
    <rect x="722" y="172" width="388" height="348" rx="12" fill="#121212" stroke="#262626" />
    <text x="750" y="202" font-size="12" font-weight="700" letter-spacing="2.4" fill="#8a8a8a">ORDER TRACKING</text>

    <g font-size="12.5">
      <!-- row 1: live -->
      <rect x="746" y="218" width="340" height="52" rx="8" fill="#191919" stroke="#ed2024" stroke-opacity="0.55" />
      <circle cx="768" cy="244" r="4.5" fill="#ed2024" />
      <text x="784" y="240" font-weight="600">ORD-48210</text>
      <text x="784" y="258" font-size="11" fill="#8a8a8a">Provisioning · 10 Gbps</text>
      <rect x="1000" y="234" width="70" height="20" rx="10" fill="#ed2024" />
      <text x="1035" y="248" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.8">LIVE</text>

      <!-- row 2 -->
      <rect x="746" y="280" width="340" height="52" rx="8" fill="#161616" stroke="#262626" />
      <circle cx="768" cy="306" r="4.5" fill="#5a5a5a" />
      <text x="784" y="302" font-weight="600" fill="#d2d2d2">ORD-48199</text>
      <text x="784" y="320" font-size="11" fill="#7a7a7a">Cross-connect · 1 Gbps</text>
      <rect x="1000" y="296" width="70" height="20" rx="10" fill="#242424" stroke="#3a3a3a" />
      <text x="1035" y="310" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.8" fill="#9a9a9a">QUEUED</text>

      <!-- row 3 -->
      <rect x="746" y="342" width="340" height="52" rx="8" fill="#161616" stroke="#262626" />
      <circle cx="768" cy="368" r="4.5" fill="#5a5a5a" />
      <text x="784" y="364" font-weight="600" fill="#d2d2d2">ORD-48147</text>
      <text x="784" y="382" font-size="11" fill="#7a7a7a">IP access · /29</text>
      <rect x="1000" y="358" width="70" height="20" rx="10" fill="#242424" stroke="#3a3a3a" />
      <text x="1035" y="372" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.8" fill="#9a9a9a">DONE</text>

      <!-- row 4 -->
      <rect x="746" y="404" width="340" height="52" rx="8" fill="#151515" stroke="#222222" />
      <circle cx="768" cy="430" r="4.5" fill="#4a4a4a" />
      <text x="784" y="426" font-weight="600" fill="#b4b4b4">ORD-48092</text>
      <text x="784" y="444" font-size="11" fill="#6e6e6e">Port upgrade · 10 Gbps</text>
      <rect x="1000" y="420" width="70" height="20" rx="10" fill="#202020" stroke="#333333" />
      <text x="1035" y="434" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.8" fill="#7a7a7a">DONE</text>
    </g>

    <!-- streaming indicator -->
    <g>
      <path d="M746 478 H1086" stroke="#242424" stroke-width="1.5" />
      <path d="M746 478 H906" stroke="#ed2024" stroke-width="2.6" stroke-linecap="round" />
      <text x="746" y="500" font-size="11" font-weight="600" letter-spacing="1.4" fill="#7a7a7a">rx-stomp · sockjs · flag-icons i18n</text>
    </g>

    <!-- stack strip -->
    <g font-size="12.5" font-weight="600" fill="#c8c8c8">
      <rect x="90" y="552" width="130" height="34" rx="17" fill="#1a1a1a" stroke="#333333" />
      <text x="155" y="574" text-anchor="middle">Angular 15</text>
      <rect x="232" y="552" width="104" height="34" rx="17" fill="#1a1a1a" stroke="#333333" />
      <text x="284" y="574" text-anchor="middle">NgRx</text>
      <rect x="348" y="552" width="176" height="34" rx="17" fill="#1a1a1a" stroke="#333333" />
      <text x="436" y="574" text-anchor="middle">OpenAPI codegen</text>
      <rect x="536" y="552" width="152" height="34" rx="17" fill="#1a1a1a" stroke="#333333" />
      <text x="612" y="574" text-anchor="middle">Google Maps</text>
      <rect x="700" y="552" width="150" height="34" rx="17" fill="#1a1a1a" stroke="#333333" />
      <text x="775" y="574" text-anchor="middle">ngx-translate</text>
      <rect x="862" y="552" width="112" height="34" rx="17" fill="#1a1a1a" stroke="#333333" />
      <text x="918" y="574" text-anchor="middle">GTM</text>
    </g>

    <!-- below the chip strip, not beside it: right-aligning at 1110 on the same
         baseline ran this label straight into the GTM chip -->
    <text x="90" y="622" font-size="12" font-weight="600" letter-spacing="1.6" fill="#6e6e6e">ondemand-portal-v2</text>
  </g>
</svg>
